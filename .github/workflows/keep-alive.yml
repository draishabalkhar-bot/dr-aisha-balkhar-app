name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS "https://jobcjaepsbfcvvzmqzzr.supabase.co/rest/v1/payment_settings?select=*&limit=1" -H "apikey: ${{ secrets.SUPABASE_KEY }}"
